<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>DLS Call</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #111216; color: #e9eaf0; font: 14px "Segoe UI", system-ui, sans-serif;
      display: grid; place-items: center; text-align: center; user-select: none;
    }
    .spin {
      width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 18px;
      border: 4px solid #2c2f39; border-top-color: #7b6cff; animation: r 0.9s linear infinite;
    }
    @keyframes r { to { transform: rotate(360deg); } }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p { color: #a5a8b5; margin: 4px 0; }
    small { color: #73778a; }
  </style>
</head>
<body>
  <div>
    <div class="spin"></div>
    <h1>DLS Call</h1>
    <p id="msg">Conectando ao servidor…</p>
    <small id="sub"></small>
  </div>
  <script>
    function setStatus(secs, server) {
      document.getElementById('msg').textContent = secs < 8
        ? 'Conectando ao servidor…'
        : 'Acordando o servidor (na primeira vez do dia pode levar até 1 minuto)…';
      document.getElementById('sub').textContent = secs >= 90
        ? 'Demorando demais? Confira sua internet ou o endereço: ' + server
        : '';
    }
  </script>
</body>
</html>
